name: Desktop app
# Runs only on version tags or on demand (Actions > Desktop app > Run workflow), never on pushes or PRs.
on:
  push:
    # Pushing a version tag such as v0.2.0 builds the apps and publishes them as a release on the
    # public releases repo, so this repo and its code can stay private.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish to the releases repo (leave empty to only build)"
        required: false
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  RELEASES_REPO: rodrigosiqueiradev/speedrunner-releases
jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable builds, no installers: an AppImage, a single .exe and a zipped .app.
          - os: ubuntu-22.04
            name: linux
            args: --bundles appimage
          - os: windows-latest
            name: windows
            args: --no-bundle
          - os: macos-latest
            name: macos
            # One app that runs on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin --bundles app
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      # The app shows its version and compares it with the latest release, so it carries the tag's.
      - name: Use the tag as the app version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: node .github/scripts/set-app-version.mjs "$RELEASE_TAG"
      - run: npm run app -w packages/desktop -- ${{ matrix.args }}
      - name: Collect the portable app
        shell: bash
        run: |
          mkdir out
          case "${{ matrix.name }}" in
            linux) cp packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage out/Speedrunner-linux.AppImage ;;
            windows) cp packages/desktop/src-tauri/target/release/speedrunner.exe out/Speedrunner-windows.exe ;;
            # ditto keeps the bundle's signature, symlinks and permissions intact.
            macos) ditto -c -k --keepParent packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Speedrunner.app out/Speedrunner-macos.zip ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: speedrunner-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, to list the changes since the previous version tag.
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      # Checking out a tag can replace an annotated tag with a lightweight one; restore its message.
      - run: git fetch --force --tags origin
      - name: Write the release notes
        run: .github/scripts/release-notes.sh "$RELEASE_TAG" > notes.md
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Publish to the releases repo
        env:
          # A fine-grained token with Contents read and write on the releases repo only.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASES_TOKEN secret is missing, so the apps can't be published to $RELEASES_REPO."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/* --clobber --repo "$RELEASES_REPO"
            gh release edit "$RELEASE_TAG" --notes-file notes.md --repo "$RELEASES_REPO"
          else
            gh release create "$RELEASE_TAG" out/* --repo "$RELEASES_REPO" \
              --title "Speedrunner $RELEASE_TAG" --notes-file notes.md
          fi
      # The releases repo's README and user manual live in releases-repo/ here, and each release copies them
      # over, so the manual always describes the version people download. Edits made directly in the releases
      # repo are overwritten, so make them in releases-repo/. Rebuilding an older tag leaves the manual alone.
      - name: Check this is the newest version
        id: newest
        run: |
          set -euo pipefail
          newest=$(git tag --list 'v*' --sort=-v:refname | sed -n 1p)
          if [ ! -d releases-repo ]; then
            echo "::notice::$RELEASE_TAG has no releases-repo folder, so the manual on $RELEASES_REPO stays as it is."
          elif [ "$RELEASE_TAG" = "$newest" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$RELEASE_TAG is older than $newest, so the manual on $RELEASES_REPO stays as it is."
          fi
      - uses: actions/checkout@v6
        if: steps.newest.outputs.update == 'true'
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          path: releases
      - name: Update the manual on the releases repo
        if: steps.newest.outputs.update == 'true'
        working-directory: releases
        run: |
          set -euo pipefail
          cp ../releases-repo/README.md README.md
          rm -rf docs && cp -R ../releases-repo/docs docs
          git add -A README.md docs
          if git diff --cached --quiet; then
            echo "The manual on $RELEASES_REPO is already up to date."
            exit 0
          fi
          git config user.name "Rodrigo Siqueira"
          git config user.email "rodrigo.siqueira.dev@gmail.com"
          git commit -m "Update the manual for $RELEASE_TAG"
          # The checkout is on the releases repo's default branch, so this pushes straight to it.
          git push origin HEAD
