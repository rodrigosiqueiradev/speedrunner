name: Desktop app
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable builds, no installers: an AppImage, a single .exe and a zipped .app.
          - os: ubuntu-22.04
            name: linux
            args: --bundles appimage
          - os: windows-latest
            name: windows
            args: --no-bundle
          - os: macos-latest
            name: macos
            # One app that runs on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin --bundles app
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run app -w packages/desktop -- ${{ matrix.args }}
      - name: Collect the portable app
        shell: bash
        run: |
          mkdir out
          case "${{ matrix.name }}" in
            linux) cp packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage out/ ;;
            windows) cp packages/desktop/src-tauri/target/release/speedrunner.exe out/Speedrunner.exe ;;
            # ditto keeps the bundle's signature, symlinks and permissions intact.
            macos) ditto -c -k --keepParent packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Speedrunner.app out/Speedrunner-macos.zip ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: speedrunner-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
