name: CI
# Typecheck and tests. The desktop apps are built by desktop.yml, on version tags or on demand.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest strips types without checking them, so type errors are caught here.
      - run: npm run typecheck
      - run: npm test
      # The web build ends with scripts/check-no-upload.mjs, which fails if the built app has
      # gained an address it could send anything to. "Nothing is uploaded" is the first rule.
      - run: npm run build
