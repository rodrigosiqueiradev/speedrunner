name: CI
# Tests only. The desktop apps are built by desktop.yml, on version tags or on demand.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # Node 24 ships npm 11, so install the npm version package.json asks for.
      - name: Install npm from package.json
        shell: bash
        run: npm install -g "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
      - run: npm ci
      - run: npm test
