name: CI
# Typecheck and tests. The desktop apps are built by desktop.yml, on version tags or on demand.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest strips types without checking them, so type errors are caught here.
      - run: npm run typecheck
      - run: npm test
      # The web build ends with scripts/check-no-upload.mjs, which fails if the built app has
      # gained an address it could send anything to. "Nothing is uploaded" is the first rule.
      - run: npm run build
