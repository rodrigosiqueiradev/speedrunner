name: CI
# Typecheck and tests. The desktop apps are built by desktop.yml, on version tags or on demand.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest strips types without checking them, so type errors are caught here.
      - run: npm run typecheck
      - run: npm test
