<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The engine's own backstop for "nothing is uploaded": everything the page loads comes from the
      app itself, and the only connections it may make are to the app's own files, to LiveSplit's
      server on this computer, and to the GitHub releases API for the desktop app's update check.
      A remote font, a tracking pixel or a fetch added by accident is refused rather than loaded.
      `ipc:` and `http://ipc.localhost` are how the desktop app's webview talks to the app itself.

      This is word for word the desktop app's policy (packages/desktop/src-tauri/tauri.conf.json,
      app.security.csp), because Tauri serves this same file and both policies then apply. Keep the
      two identical: test/csp.test.ts fails if they drift apart. The browser build never asks GitHub
      for anything (the update check is off unless the app is the desktop one, src/App.tsx).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost ws://localhost:* ws://127.0.0.1:* https://api.github.com/repos/rodrigosiqueiradev/speedrunner/releases/latest; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speedrunner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%229%22 r=%226%22 fill=%22none%22 stroke=%22%232a78d6%22 stroke-width=%222%22/%3E%3Cpath d=%22M8 9V6M6 1h4%22 stroke=%22%232a78d6%22 stroke-width=%222%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
